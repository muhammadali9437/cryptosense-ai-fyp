name: cryptosense_ai
description: CryptoSense AI - AI-based real-time cryptocurrency market analytics (FYP frontend).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1        # Sora (headings) + DM Sans (body)
  http: ^1.2.2                # REST calls (Binance candles)
  web_socket_channel: ^3.0.1  # live Binance price stream
  intl: ">=0.19.0 <0.21.0"    # number and date formatting
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
